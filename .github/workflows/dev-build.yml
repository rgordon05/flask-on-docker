name: Development build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Build and start development services
        run: docker compose -f docker-compose.yml up -d --build

      - name: Check the homepage
        run: |
          curl --fail --show-error \
            --retry 20 --retry-delay 3 --retry-all-errors \
            --max-time 5 \
            http://localhost:8505/ \
            -o /tmp/homepage.json
          python3 -c 'import json; assert json.load(open("/tmp/homepage.json")) == {"hello": "world"}'

      - name: Show logs on failure
        if: failure()
        run: docker compose -f docker-compose.yml logs --tail=100

      - name: Stop services
        if: always()
        run: docker compose -f docker-compose.yml down
